{% extends 'base.html' %}

{% block content %}
    <h1>Book an appointment</h1>

    <form method="post" action="{{ url_for('appointments.book') }}">
        <label>Clinician
            <select id="clinician_id" name="clinician_id" required>
                {% for clinician in clinicians %}
                    <option value="{{ clinician['id'] }}">{{ clinician['full_name'] }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Time
            <select id="slot_start" name="slot_start" class="mono" required>
                {% for slot in slots %}
                    <option value="{{ slot }}">{{ slot }}</option>
                {% endfor %}
            </select>
        </label>
        <button type="submit">Book</button>
    </form>

    <h2>Your appointments</h2>
    {% for appointment in appointments %}
        <div class="row">
            <span class="mono">{{ appointment['slot_start'] }}</span>
            <span>{{ appointment['full_name'] }}</span>
        </div>
    {% else %}
        <p class="muted">You have no appointments.</p>
    {% endfor %}
{% endblock %}
