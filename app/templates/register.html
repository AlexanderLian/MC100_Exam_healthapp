{% extends 'base.html' %}

{% block main_class %}narrow{% endblock %}

{% block content %}
    <h1>Register as a patient</h1>
    <form method="post" action="{{ url_for('auth.register') }}">
        <label>Email
            <input type="email" id="email" name="email" value="{{ email or '' }}" required>
        </label>
        <label>Full name
            <input type="text" id="full_name" name="full_name" value="{{ full_name or '' }}" required>
        </label>
        <label>Password (at least 8 characters)
            <input type="password" id="password" name="password" autocomplete="new-password" required>
        </label>
        <label>National ID (11 digits)
            <input type="text" id="national_id" name="national_id" inputmode="numeric" autocomplete="off" class="mono" required>
        </label>
        <button type="submit">Register</button>
    </form>
{% endblock %}
