{% extends 'base.html' %}

{% block content %}
    <h1>Information assistant</h1>

    <p class="muted">General questions only. The assistant cannot see your records.</p>

    <form method="post" action="{{ url_for('assistant.ask') }}">
        <label>Your question
            <textarea id="question" name="question" rows="3" maxlength="500" required>{{ question or '' }}</textarea>
        </label>
        <button type="submit">Send</button>
    </form>

    {% if answer %}
        <div class="answer">
            <p>{{ answer }}</p>
            <p class="mono muted">Written by a language model.</p>
        </div>
    {% endif %}
{% endblock %}
