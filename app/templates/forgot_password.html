{% extends 'base.html' %}

{% block content %}
    <h1>Forgot password</h1>
    <form method="post" action="{{ url_for('auth.forgot_password') }}">
        <p>
            <label for="email">Email</label><br>
            <input type="email" id="email" name="email" required>
        </p>
        <button type="submit">Send reset code</button>
    </form>
{% endblock %}
