{% extends 'base.html' %}

{% block content %}
    <h1>My patients</h1>

    <h2>Patient</h2>
    {% for patient in patients %}
        <div class="row">
            <a href="{{ url_for('notes.patient_notes', patient_id=patient['id']) }}">{{ patient['full_name'] }}</a>
        </div>
    {% else %}
        <p class="muted">You have no patients with appointments.</p>
    {% endfor %}
{% endblock %}
